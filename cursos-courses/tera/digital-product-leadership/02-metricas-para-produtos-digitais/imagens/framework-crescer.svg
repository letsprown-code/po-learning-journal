<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="Inter, sans-serif">
  <title id="t">Framework CRESCER (Igor Torres, 2021)</title>
  <desc id="d">Sete grandes indicadores em sequência na jornada do cliente: Entrada, Engajamento, Conversão, Retenção e Receita, com Satisfação e Compartilhamento abaixo, ligados a toda a jornada. As iniciais formam CRESCER. Motores de crescimento: entrada e receita ligam ao motor pago, retenção ao motor de aderência e compartilhamento ao motor viral. Engajamento e conversão formam o uso do produto.</desc>
  <rect width="960" height="500" fill="#FFFFFF"/>
  <text x="40" y="58" font-size="32" font-weight="900" letter-spacing="-0.8" fill="#0D0D0D">Framework</text>
  <rect x="228" y="32" width="152" height="34" rx="3" fill="#DFFF00"/>
  <text x="304" y="58" text-anchor="middle" font-size="32" font-weight="900" letter-spacing="-0.8" fill="#0D0D0D">CRESCER</text>
  <text x="40" y="88" font-size="14" font-weight="700" letter-spacing="1.6" fill="#5E5E5E">HEART + AARRR + CONSTELAÇÃO DE MÉTRICAS · IGOR TORRES, 2021</text>

  <g stroke="#0D0D0D" stroke-width="2" fill="#FFFFFF">
    <rect x="40" y="120" width="160" height="110" rx="12"/>
    <rect x="220" y="120" width="160" height="110" rx="12"/>
    <rect x="400" y="120" width="160" height="110" rx="12"/>
    <rect x="580" y="120" width="160" height="110" rx="12"/>
    <rect x="760" y="120" width="160" height="110" rx="12"/>
  </g>
  <g fill="#A0B300" font-size="22">
    <text x="203" y="182">›</text><text x="383" y="182">›</text><text x="563" y="182">›</text><text x="743" y="182">›</text>
  </g>
  <g font-size="19" font-weight="900" fill="#0D0D0D" letter-spacing="-0.3">
    <text x="58" y="160">Entrada</text><text x="238" y="160">Engajamento</text><text x="418" y="160">Conversão</text><text x="598" y="160">Retenção</text><text x="778" y="160">Receita</text>
  </g>
  <g font-size="13" fill="#5E5E5E">
    <text x="58" y="186">Como chegam?</text>
    <text x="238" y="186">Como interagem?</text>
    <text x="418" y="186">Concluem a</text><text x="418" y="204">tarefa?</text>
    <text x="598" y="186">Voltam a</text><text x="598" y="204">interagir?</text>
    <text x="778" y="186">Tudo isso gera</text><text x="778" y="204">receita?</text>
  </g>
  <rect x="220" y="240" width="340" height="30" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="390" y="260" text-anchor="middle" font-size="13" fill="#0D0D0D">engajamento + conversão = uso do produto</text>

  <g stroke="#0D0D0D" stroke-width="2" fill="#FFFFFF">
    <rect x="40" y="290" width="430" height="80" rx="12"/>
    <rect x="490" y="290" width="430" height="80" rx="12"/>
  </g>
  <text x="58" y="322" font-size="19" font-weight="900" fill="#0D0D0D">Satisfação</text>
  <text x="58" y="348" font-size="13" fill="#5E5E5E">Estão satisfeitas? Pode ser o grande diferencial</text>
  <text x="508" y="322" font-size="19" font-weight="900" fill="#0D0D0D">Compartilhamento</text>
  <text x="508" y="348" font-size="13" fill="#5E5E5E">Estão indicando? Ligado à satisfação, mas separado</text>

  <text x="40" y="408" font-size="14" font-weight="700" fill="#0D0D0D">Motores de crescimento</text>
  <g font-size="14" fill="#0D0D0D">
    <text x="40" y="434">• Entrada + receita → <tspan font-weight="700">motor pago</tspan> (LTV × CAC)</text>
    <text x="40" y="456">• Retenção → <tspan font-weight="700">motor de aderência</tspan></text>
    <text x="490" y="434">• Compartilhamento → <tspan font-weight="700">motor viral</tspan></text>
    <text x="490" y="456">• Iniciais: Compartilhamento, Receita, Entrada,</text>
    <text x="504" y="476" fill="#5E5E5E">Satisfação, Conversão, Engajamento, Retenção</text>
  </g>
</svg>
