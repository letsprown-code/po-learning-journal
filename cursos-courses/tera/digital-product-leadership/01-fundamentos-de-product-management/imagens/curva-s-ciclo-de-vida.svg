<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d" font-family="Inter, sans-serif">
  <title id="t">Curva S do ciclo de vida de produto</title>
  <desc id="d">Gráfico de vendas ou aquisição ao longo do tempo. A curva sobe devagar na introdução (foco em retenção, early adopters), passa pelo abismo, sobe rápido no crescimento (foco em mais usuários), estabiliza na maturidade (foco em vazamentos do funil, mercado mainstream) e cai no declínio (foco na causa da queda).</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9A9A9A" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="900" height="600" fill="#FFFFFF"/>
  <text x="90" y="54" font-size="32" font-weight="900" letter-spacing="-0.8" fill="#0D0D0D">Ciclo de vida do produto ·</text>
  <rect x="476" y="28" width="128" height="34" rx="3" fill="#DFFF00"/>
  <text x="540" y="54" text-anchor="middle" font-size="32" font-weight="900" letter-spacing="-0.8" fill="#0D0D0D">curva S</text>
  <line x1="90" y1="460" x2="860" y2="460" stroke="#0D0D0D" stroke-width="2"/>
  <line x1="90" y1="460" x2="90" y2="100" stroke="#0D0D0D" stroke-width="2"/>
  <text x="860" y="488" text-anchor="end" font-size="13" fill="#5E5E5E">tempo · time →</text>
  <text x="50" y="280" text-anchor="middle" font-size="13" fill="#5E5E5E" transform="rotate(-90 50 280)">vendas / aquisição →</text>
  <g stroke="#C4C4C4" stroke-dasharray="5 6" stroke-width="1.5">
    <line x1="270" y1="100" x2="270" y2="460"/>
    <line x1="480" y1="100" x2="480" y2="460"/>
    <line x1="690" y1="100" x2="690" y2="460"/>
  </g>
  <rect x="232" y="380" width="38" height="80" fill="url(#hatch)"/>
  <text x="251" y="372" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#0D0D0D">ABISMO</text>
  <path d="M 90 450 C 200 445, 240 420, 290 360 S 400 220, 520 212 S 640 206, 700 224 S 800 330, 850 390" fill="none" stroke="#0D0D0D" stroke-width="4" stroke-linecap="round"/>
  <g text-anchor="middle" fill="#0D0D0D">
    <text x="180" y="128" font-size="18" font-weight="900" letter-spacing="-0.3">1 · Introdução</text>
    <text x="180" y="150" font-size="13" fill="#5E5E5E">busca de PMF</text>
    <text x="375" y="128" font-size="18" font-weight="900" letter-spacing="-0.3">2 · Crescimento</text>
    <text x="375" y="150" font-size="13" fill="#5E5E5E">growth · escala</text>
    <text x="585" y="128" font-size="18" font-weight="900" letter-spacing="-0.3">3 · Maturidade</text>
    <text x="585" y="150" font-size="13" fill="#5E5E5E">"vaca leiteira"</text>
    <text x="775" y="128" font-size="18" font-weight="900" letter-spacing="-0.3">4 · Declínio</text>
    <text x="775" y="150" font-size="13" fill="#5E5E5E">inovação · disrupção</text>
  </g>
  <text x="165" y="415" text-anchor="middle" font-size="12" fill="#5E5E5E">early adopters</text>
  <text x="585" y="270" text-anchor="middle" font-size="12" fill="#5E5E5E">mercado mainstream</text>
  <g font-size="13" text-anchor="middle" fill="#0D0D0D">
    <text x="180" y="525" font-weight="900">Foco: retenção</text>
    <text x="180" y="545" fill="#5E5E5E">poucas pessoas usando muito</text>
    <text x="375" y="525" font-weight="900">Foco: mais usuários</text>
    <text x="375" y="545" fill="#5E5E5E">topo do funil</text>
    <text x="585" y="525" font-weight="900">Foco: vazamentos</text>
    <text x="585" y="545" fill="#5E5E5E">funil todo · simplificar</text>
    <text x="775" y="525" font-weight="900">Foco: causa da queda</text>
    <text x="775" y="545" fill="#5E5E5E">testar novas apostas</text>
  </g>
  <line x1="90" y1="570" x2="860" y2="570" stroke="#E0E0E0" stroke-width="1"/>
  <text x="860" y="590" text-anchor="end" font-size="12" fill="#5E5E5E">Tera · DPL 01 · Ciclo de Vida de Produto</text>
</svg>
