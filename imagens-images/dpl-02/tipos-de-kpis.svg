<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Inter, sans-serif">
  <title id="t">Os quatro tipos de KPI</title>
  <desc id="d">Um indicador vira KPI quando está ligado a um objetivo de negócio. Quatro quadros com os tipos de KPI da aula e dois exemplos de cada: Produtividade (otimizar a produção: CAC, custo de aquisição de cliente, quanto menor melhor; ROI, retorno sobre investimento). Qualidade (atender necessidades e vontades do cliente: número de tickets ou reclamações; SLA, acordo de nível de serviço, tempo para atender). Capacidade (fazer mais com menos: requisições por minuto na Black Friday; entregas por dia). Estratégia (desempenho da estratégia: market share; NPS).</desc>
  <rect width="960" height="560" fill="#FFFFFF"/>
  <text x="40" y="58" font-size="32" font-weight="900" letter-spacing="-0.8" fill="#0D0D0D">Os quatro tipos de</text>
  <rect x="320" y="32" width="76" height="34" rx="3" fill="#DFFF00"/>
  <text x="358" y="58" text-anchor="middle" font-size="32" font-weight="900" letter-spacing="-0.8" fill="#0D0D0D">KPI</text>
  <text x="40" y="88" font-size="14" font-weight="700" letter-spacing="1.6" fill="#5E5E5E">INDICADOR + OBJETIVO DE NEGÓCIO = INDICADOR-CHAVE DE PERFORMANCE</text>

  <g stroke="#0D0D0D" stroke-width="2" fill="#FFFFFF">
    <rect x="40" y="112" width="430" height="190" rx="12"/>
    <rect x="490" y="112" width="430" height="190" rx="12"/>
    <rect x="40" y="318" width="430" height="190" rx="12"/>
    <rect x="490" y="318" width="430" height="190" rx="12"/>
  </g>
  <g font-size="22" font-weight="900" fill="#0D0D0D" letter-spacing="-0.4">
    <text x="64" y="150">Produtividade</text><text x="514" y="150">Qualidade</text>
    <text x="64" y="356">Capacidade</text><text x="514" y="356">Estratégia</text>
  </g>
  <g font-size="14" fill="#5E5E5E">
    <text x="64" y="176">Otimizar a produção (maximizando ou minimizando)</text>
    <text x="514" y="176">Atender necessidades e vontades do cliente</text>
    <text x="64" y="382">Fazer mais com menos</text>
    <text x="514" y="382">Desempenho da estratégia da empresa</text>
  </g>
  <g font-size="15" fill="#0D0D0D">
    <text x="64" y="216"><tspan font-weight="700">CAC</tspan> · custo de aquisição de cliente</text>
    <text x="78" y="238" fill="#5E5E5E" font-size="13">quanto menor, melhor</text>
    <text x="64" y="270"><tspan font-weight="700">ROI</tspan> · retorno sobre investimento</text>

    <text x="514" y="216"><tspan font-weight="700">Tickets</tspan> · reclamações no suporte</text>
    <text x="514" y="248"><tspan font-weight="700">SLA</tspan> · acordo de nível de serviço</text>
    <text x="528" y="270" fill="#5E5E5E" font-size="13">em quanto tempo a empresa atende</text>

    <text x="64" y="422"><tspan font-weight="700">Requisições por minuto</tspan></text>
    <text x="78" y="444" fill="#5E5E5E" font-size="13">aguentar o tráfego da Black Friday</text>
    <text x="64" y="476"><tspan font-weight="700">Entregas por dia</tspan></text>

    <text x="514" y="422"><tspan font-weight="700">Market share</tspan> · fatia do mercado</text>
    <text x="514" y="454"><tspan font-weight="700">NPS</tspan> · recomendaria a amigos?</text>
    <text x="528" y="476" fill="#5E5E5E" font-size="13">controverso: precisa de interpretação</text>
  </g>
  <line x1="40" y1="526" x2="920" y2="526" stroke="#A0B300" stroke-width="1.5"/>
  <text x="40" y="546" font-size="12" fill="#5E5E5E">Redesenho de estudo · Módulo 02 · Introdução aos KPIs (DPL · Tera)</text>
</svg>
