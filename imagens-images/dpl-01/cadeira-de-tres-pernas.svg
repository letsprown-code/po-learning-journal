<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Cadeira de três pernas da gestão de produtos</title>
  <desc id="d">Três círculos sobrepostos: Experiência (o produto é desejável), Negócios (o produto é rentável) e Viabilidade ou Tecnologia (dá para construir, manter e escalar). No centro, onde os três se encontram, está a gestão de produtos.</desc>
  <rect width="800" height="640" fill="#ffffff"/>
  <text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Cadeira de três pernas · Three-legged stool</text>
  <g fill-opacity="0.28" stroke-width="3">
    <circle cx="300" cy="270" r="170" fill="#f59e0b" stroke="#b45309"/>
    <circle cx="500" cy="270" r="170" fill="#3b82f6" stroke="#1d4ed8"/>
    <circle cx="400" cy="430" r="170" fill="#10b981" stroke="#047857"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="235" y="215" font-size="22" font-weight="700">Experiência</text>
    <text x="235" y="242" font-size="16">UX · usabilidade</text>
    <text x="235" y="266" font-size="16" font-style="italic">desejável</text>

    <text x="565" y="215" font-size="22" font-weight="700">Negócios</text>
    <text x="565" y="242" font-size="16">Business</text>
    <text x="565" y="266" font-size="16" font-style="italic">rentável</text>

    <text x="400" y="498" font-size="22" font-weight="700">Viabilidade</text>
    <text x="400" y="523" font-size="15">Tecnologia · Feasibility</text>
    <text x="400" y="545" font-size="15" font-style="italic">construir, manter, escalar</text>
  </g>
  <g>
    <rect x="318" y="312" width="164" height="58" rx="12" fill="#1f2937"/>
    <text x="400" y="337" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Gestão de</text>
    <text x="400" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">produtos</text>
  </g>
  <text x="400" y="620" text-anchor="middle" font-size="14" fill="#4b5563">Sem uma das pernas, a cadeira cai. · Tera DPL 01, aula Fundamentos de produto</text>
</svg>
