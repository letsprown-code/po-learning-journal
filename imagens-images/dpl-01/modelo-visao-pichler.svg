<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Inter, sans-serif">
  <title id="t">Três jeitos de escrever a visão</title>
  <desc id="d">Três colunas com os modelos da aula. 1, a frase em seis partes (Para, que estão insatisfeitos com, nosso produto é uma, que oferece, ao contrário de, nós montamos). 2, o canvas de visão com Grupo-alvo e Necessidades (valor para o usuário), Produto, e Objetivos de negócio (valor para a empresa), que geram a visão. 3, a história em seis passos: Era uma vez, Então um dia, E por causa disso (três vezes), Quando finalmente.</desc>
  <rect width="960" height="600" fill="#FFFFFF"/>
  <text x="40" y="58" font-size="32" font-weight="900" letter-spacing="-0.8" fill="#0D0D0D">Três jeitos de</text>
  <rect x="262" y="32" width="142" height="34" rx="3" fill="#DFFF00"/>
  <text x="333" y="58" text-anchor="middle" font-size="32" font-weight="900" letter-spacing="-0.8" fill="#0D0D0D">escrever</text>
  <text x="414" y="58" font-size="32" font-weight="900" letter-spacing="-0.8" fill="#0D0D0D">a visão</text>
  <text x="40" y="88" font-size="14" font-weight="700" letter-spacing="1.6" fill="#5E5E5E">EXEMPLO DA AULA: CARTÃO DE CRÉDITO PARA MICROEMPREENDEDORES</text>

  <g stroke="#0D0D0D" stroke-width="2" fill="#FFFFFF">
    <rect x="40" y="112" width="280" height="440" rx="12"/>
    <rect x="340" y="112" width="280" height="440" rx="12"/>
    <rect x="640" y="112" width="280" height="440" rx="12"/>
  </g>
  <g font-size="20" font-weight="900" fill="#0D0D0D" letter-spacing="-0.3">
    <text x="60" y="148">1 · Frase guiada</text>
    <text x="360" y="148">2 · Canvas de visão</text>
    <text x="660" y="148">3 · História</text>
  </g>
  <g font-size="13" fill="#5E5E5E">
    <text x="60" y="170">Roman Pichler</text>
    <text x="360" y="170">Roman Pichler</text>
    <text x="660" y="170">Ebi Atawodi (Lenny's Podcast)</text>
  </g>

  <g font-size="15" fill="#0D0D0D">
    <text x="60" y="206" font-weight="700">a. Para…</text>
    <text x="72" y="226" fill="#5E5E5E" font-size="13">clientes-alvo</text>
    <text x="60" y="256" font-weight="700">b. Que estão insatisfeitos com…</text>
    <text x="72" y="276" fill="#5E5E5E" font-size="13">a alternativa atual do mercado</text>
    <text x="60" y="306" font-weight="700">c. Nosso produto é uma…</text>
    <text x="72" y="326" fill="#5E5E5E" font-size="13">categoria do produto</text>
    <text x="60" y="356" font-weight="700">d. Que oferece…</text>
    <text x="72" y="376" fill="#5E5E5E" font-size="13">capacidade-chave</text>
    <text x="60" y="406" font-weight="700">e. Ao contrário de…</text>
    <text x="72" y="426" fill="#5E5E5E" font-size="13">a alternativa de produto</text>
    <text x="60" y="456" font-weight="700">f. Nós montamos…</text>
    <text x="72" y="476" fill="#5E5E5E" font-size="13">característica-chave do produto</text>
    <text x="60" y="516" fill="#5E5E5E" font-size="13">Ficou longa? É a "rodinha da</text>
    <text x="60" y="534" fill="#5E5E5E" font-size="13">bicicleta": depois você resume.</text>
  </g>

  <g font-size="15" fill="#0D0D0D">
    <rect x="360" y="190" width="240" height="52" rx="6" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="1.5"/>
    <text x="374" y="212" font-weight="700">Visão</text>
    <text x="374" y="232" fill="#5E5E5E" font-size="13">propósito · mudança positiva</text>
    <text x="480" y="262" text-anchor="middle" fill="#A0B300" font-size="18">▲</text>
    <rect x="360" y="272" width="114" height="74" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
    <text x="370" y="296" font-weight="700" font-size="14">Grupo-alvo</text>
    <text x="370" y="316" fill="#5E5E5E" font-size="12">mercado,</text>
    <text x="370" y="332" fill="#5E5E5E" font-size="12">segmento</text>
    <rect x="486" y="272" width="114" height="74" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
    <text x="496" y="296" font-weight="700" font-size="14">Necessidades</text>
    <text x="496" y="316" fill="#5E5E5E" font-size="12">problemas e</text>
    <text x="496" y="332" fill="#5E5E5E" font-size="12">benefícios</text>
    <rect x="360" y="358" width="240" height="64" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
    <text x="374" y="382" font-weight="700" font-size="14">Produto</text>
    <text x="374" y="400" fill="#5E5E5E" font-size="12">diferencial, funcionalidades-chave</text><text x="374" y="415" fill="#5E5E5E" font-size="12">e viabilidade</text>
    <rect x="360" y="434" width="240" height="64" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
    <text x="374" y="458" font-weight="700" font-size="14">Objetivos de negócio</text>
    <text x="374" y="478" fill="#5E5E5E" font-size="12">oportunidade e objetivos da empresa</text>
    <text x="360" y="526" fill="#5E5E5E" font-size="13">Valor para o usuário + valor para a</text>
    <text x="360" y="544" fill="#5E5E5E" font-size="13">empresa → produto → visão</text>
  </g>

  <g font-size="15" fill="#0D0D0D">
    <text x="660" y="210" font-weight="700">1. Era uma vez…</text>
    <text x="672" y="230" fill="#5E5E5E" font-size="13">o contexto</text>
    <text x="660" y="264" font-weight="700">2. Então um dia…</text>
    <text x="672" y="284" fill="#5E5E5E" font-size="13">algo muda</text>
    <text x="660" y="318" font-weight="700">3. E por causa disso…</text>
    <text x="660" y="348" font-weight="700">4. E por causa disso…</text>
    <text x="660" y="378" font-weight="700">5. E por causa disso…</text>
    <text x="672" y="398" fill="#5E5E5E" font-size="13">os efeitos na vida do cliente</text>
    <text x="660" y="432" font-weight="700">6. Quando, finalmente…</text>
    <text x="672" y="452" fill="#5E5E5E" font-size="13">o destino alcançado</text>
    <text x="660" y="516" fill="#5E5E5E" font-size="13">Visão é narrativa: personagem,</text>
    <text x="660" y="534" fill="#5E5E5E" font-size="13">enredo, diálogo e ritmo.</text>
  </g>
  <line x1="40" y1="574" x2="920" y2="574" stroke="#A0B300" stroke-width="1.5"/>
  <text x="40" y="592" font-size="12" fill="#5E5E5E">Redesenho de estudo · Aula 10 · Visão de produto (DPL · Tera)</text>
</svg>
